name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            pip install torch
          fi
      - run: pip install numpy scipy nltk pytest
      - name: Geometry and model tests
        run: python -m pytest tests -q
      - name: Smoke-test an experiment end to end
        run: python e3_linkpred.py --quick --workers 2
