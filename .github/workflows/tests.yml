name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Linux only: hosted macOS runners were not being assigned when this was set up.
    # The same tests pass on macOS (Apple silicon) locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install numpy scipy nltk pytest
      - name: Geometry and model tests
        run: python -m pytest tests -q
      - name: Smoke-test an experiment end to end
        run: python e3_linkpred.py --quick --workers 2
